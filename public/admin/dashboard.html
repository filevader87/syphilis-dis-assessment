<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DIS Admin Dashboard — Syphilis 2026</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#f5f7fa; --card:#fff; --primary:#0b5ed7; --text:#1f2937;
    --muted:#6b7280; --border:#e5e7eb;
    --good:#16a34a; --warn:#eab308; --bad:#dc2626;
    --r1:#6366f1; --r2:#f59e0b;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  header { background:var(--primary); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:19px; font-weight:600; }
  .hactions { display:flex; gap:8px; align-items:center; }
  .hactions button, .hactions a.btn {
    background:#fff; color:var(--primary); border:0; padding:7px 14px; border-radius:6px;
    font-weight:600; cursor:pointer; text-decoration:none; font-size:13px;
  }
  .hactions button.ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.55); }
  main { max-width:1240px; margin:22px auto; padding:0 16px; }

  /* Section label */
  .section-title {
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:28px 0 12px; padding-bottom:6px; border-bottom:2px solid var(--border);
  }

  /* Card grid */
  .kpi-grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-bottom:4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .kpi .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .kpi .val   { font-size:26px; font-weight:700; margin-top:4px; }

  /* Two-column row */
  .row2 { display:grid; gap:14px; grid-template-columns:1fr 1fr; margin-bottom:14px; }
  @media(max-width:820px){ .row2 { grid-template-columns:1fr; } }

  /* Region comparison */
  .region-grid { display:grid; gap:14px; grid-template-columns:1fr 1fr; margin-bottom:14px; }
  @media(max-width:820px){ .region-grid { grid-template-columns:1fr; } }
  .region-card { border-radius:10px; padding:18px; }
  .region-card.r1 { background:#eef2ff; border:2px solid var(--r1); }
  .region-card.r2 { background:#fffbeb; border:2px solid var(--r2); }
  .region-card h3 { margin:0 0 12px; font-size:15px; }
  .region-card h3.r1 { color:var(--r1); }
  .region-card h3.r2 { color:#b45309; }
  .mini-kpi-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .mini-kpi { flex:1; min-width:90px; background:rgba(255,255,255,.7); border-radius:8px; padding:10px; text-align:center; }
  .mini-kpi .ml { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .mini-kpi .mv { font-size:20px; font-weight:700; margin-top:2px; }
  .domain-bar-row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .domain-bar-row:last-child { border:0; }
  .bar-wrap { width:120px; height:7px; background:#e5e7eb; border-radius:4px; overflow:hidden; display:inline-block; margin:0 8px; vertical-align:middle; }
  .bar-fill { height:100%; border-radius:4px; }

  /* Shared styles */
  h2 { font-size:13px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; }
  .alert-box { padding:9px 12px; border-radius:6px; margin-bottom:8px; font-size:13px; }
  .alert-box.critical { background:#fee2e2; color:#991b1b; border-left:4px solid var(--bad); }
  .alert-box.warning  { background:#fef3c7; color:#92400e; border-left:4px solid var(--warn); }
  .empty { color:var(--muted); font-style:italic; padding:6px 0; }
  .rank-1 { font-weight:700; color:var(--good); }
  .band-pill { padding:2px 7px; border-radius:999px; font-size:10px; font-weight:700; text-transform:uppercase; }
  .band-proficient         { background:#dcfce7; color:#166534; }
  .band-needs_reinforcement { background:#fef3c7; color:#92400e; }
  .band-needs_retraining   { background:#fee2e2; color:#991b1b; }
  .pct-good { color:var(--good); font-weight:600; }
  .pct-warn { color:var(--warn); font-weight:600; }
  .pct-bad  { color:var(--bad);  font-weight:600; }
  .tag-r1 { background:#eef2ff; color:var(--r1); padding:1px 7px; border-radius:999px; font-size:10px; font-weight:600; }
  .tag-r2 { background:#fffbeb; color:#b45309;   padding:1px 7px; border-radius:999px; font-size:10px; font-weight:600; }
  .muted  { color:var(--muted); font-size:11px; }
  details { margin-top:5px; }
  summary { cursor:pointer; color:var(--primary); font-size:13px; }
  pre.resp { background:#f9fafb; border:1px solid var(--border); padding:8px; border-radius:6px; white-space:pre-wrap; font-size:12px; margin:5px 0 0; }

  /* Tester review cards */
  .review-card { border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; transition:box-shadow .15s; }
  .review-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .review-card-header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer; user-select:none; background:var(--card); gap:8px; }
  .review-card-header:hover { background:#f0f4ff; }
  .review-card-header .token { font-weight:600; font-size:14px; color:var(--text); }
  .review-card-header .meta { display:flex; align-items:center; gap:6px; }
  .review-badge { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 6px; border-radius:999px; font-size:11px; font-weight:700; }
  .review-badge.pending { background:#fef3c7; color:#92400e; }
  .review-badge.done { background:#dcfce7; color:#166534; }
  .review-card-body { max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .review-card.open .review-card-body { max-height:2000px; }
  .review-item { padding:10px 14px; border-top:1px solid var(--border); background:#fafbfc; }
  .review-item .q-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
  .review-item .response-text { background:#fff; border:1px solid var(--border); padding:8px 10px; border-radius:6px; font-size:13px; line-height:1.5; margin:6px 0; white-space:pre-wrap; }
  .review-item .rubric-info { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .override-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .override-row label { font-size:12px; color:var(--muted); }
  .override-row input { width:56px; padding:4px 6px; border:1px solid var(--border); border-radius:4px; font-size:13px; }
  .override-row button { padding:4px 12px; font-size:12px; background:var(--primary); color:#fff; border:0; border-radius:4px; cursor:pointer; }
  .override-row .result { font-size:12px; color:var(--good); }

  /* Login */
  .login-wrap { max-width:400px; margin:80px auto; }
  .login-wrap input { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; font-size:15px; margin-top:6px; }
  .login-wrap button { background:var(--primary); color:#fff; border:0; padding:10px 20px; border-radius:6px; font-weight:600; cursor:pointer; margin-top:10px; }
  .login-err { color:var(--bad); font-size:13px; margin-top:8px; }

  /* ── NEW: Tester detail modal ── */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; display:flex; align-items:flex-start; justify-content:center; padding:30px 10px; overflow-y:auto; }
  .modal-content { background:var(--card); border-radius:12px; max-width:900px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,.2); padding:0; position:relative; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); background:#f8fafc; border-radius:12px 12px 0 0; }
  .modal-header h2 { font-size:16px; color:var(--text); text-transform:none; letter-spacing:0; margin:0; }
  .modal-close { background:var(--border); border:0; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:16px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:#d1d5db; }
  .modal-body { padding:16px 20px; max-height:70vh; overflow-y:auto; }
  .modal-meta { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; font-size:13px; }
  .modal-meta span { background:#f0f4ff; padding:3px 10px; border-radius:6px; }
  .detail-item { border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; }
  .detail-item-header { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#f8fafc; cursor:pointer; }
  .detail-item-header .qid { font-weight:700; font-size:13px; width:36px; }
  .detail-item-header .qdomain { color:var(--muted); font-size:12px; flex:1; margin-left:8px; }
  .detail-item-header .qscore { font-weight:600; font-size:13px; min-width:52px; text-align:right; }
  .detail-item-header .qstatus { min-width:20px; text-align:center; font-size:14px; }
  .detail-item-body { padding:10px 12px; border-top:1px solid var(--border); font-size:13px; }
  .detail-item-body .label { font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:2px; }
  .detail-item-body .value { margin-bottom:8px; line-height:1.5; }
  .detail-item-body .value code { background:#f1f5f9; padding:2px 6px; border-radius:4px; font-size:12px; }
  .override-history { background:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:8px 10px; font-size:12px; margin-top:6px; }
  .override-history .oh-title { font-weight:600; color:#92400e; margin-bottom:4px; }
  .override-history .oh-entry { color:#78350f; margin-left:8px; }
  .clickable-token { cursor:pointer; color:var(--primary); text-decoration:underline; text-decoration-style:dotted; }
  .clickable-token:hover { color:#0842a0; text-decoration-style:solid; }

  /* ── NEW: Heat map table ── */
  .heatmap-wrap { overflow-x:auto; }
  .heatmap-table { font-size:11px; border-collapse:separate; border-spacing:2px; }
  .heatmap-table th, .heatmap-table td { padding:4px 5px; text-align:center; min-width:28px; border:0; }
  .heatmap-table th:first-child, .heatmap-table td:first-child { text-align:left; min-width:100px; font-weight:600; position:sticky; left:0; background:var(--card); z-index:1; }
  .heatmap-cell { border-radius:3px; font-weight:600; }
  .hm-full { background:#dcfce7; color:#166534; }
  .hm-partial { background:#fef3c7; color:#92400e; }
  .hm-zero { background:#fee2e2; color:#991b1b; }
  .hm-na { background:#f3f4f6; color:#9ca3af; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SECRET_KEY = 'dis_admin_secret';
let secret = sessionStorage.getItem(SECRET_KEY) || '';
let charts = {};
let submissionsCache = null; // cached raw submissions for detail views
let questionsCache = null; // cached question bank for answer display

const pctClass  = p => p >= 80 ? 'pct-good' : p >= 70 ? 'pct-warn' : 'pct-bad';
const barColor  = p => p >= 80 ? '#16a34a'  : p >= 70 ? '#eab308'  : '#dc2626';
const escHtml   = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const regionTag = r => r === 'Region 1'
  ? `<span class="tag-r1">Region 1</span>`
  : r === 'Region 2'
    ? `<span class="tag-r2">Region 2</span>`
    : `<span class="muted">${escHtml(r)}</span>`;

// ─── Auth ────────────────────────────────────────────────────────────────────
function loginScreen(msg) {
  document.getElementById('app').innerHTML = `
    <div class="card login-wrap">
      <h2 style="font-size:18px;color:var(--text);text-transform:none;letter-spacing:0;margin-bottom:4px;">Admin sign-in</h2>
      <p class="muted">Enter the shared admin secret distributed to program supervisors.</p>
      <input id="sec" type="password" placeholder="Shared secret" />
      <div><button onclick="signIn()">Sign in</button></div>
      ${msg ? `<p class="login-err">${escHtml(msg)}</p>` : ''}
    </div>`;
  document.getElementById('sec').addEventListener('keydown', e => { if (e.key==='Enter') signIn(); });
}
function signIn() {
  const v = document.getElementById('sec').value.trim();
  if (!v) return;
  secret = v; sessionStorage.setItem(SECRET_KEY, secret); load();
}
function signOut() { sessionStorage.removeItem(SECRET_KEY); secret=''; loginScreen(); }

// ─── Shell ───────────────────────────────────────────────────────────────────
function shell() {
  document.getElementById('app').innerHTML = `
    <header>
      <div style="display:flex; align-items:center;">
        <img src="../logo.png" alt="DPH Logo" style="height:32px; margin-right:10px; vertical-align:middle;">
        <h1>DIS Admin Dashboard — Syphilis 2026</h1>
      </div>
      <div class="hactions">
        <a class="btn" id="csvBtn" href="#">⇩ Export CSV</a>
        <button onclick="load()">↻ Refresh</button>
        <button class="ghost" onclick="signOut()">Sign out</button>
      </div>
    </header>
    <main>
      <div class="section-title">Program overview</div>
      <div class="kpi-grid" id="kpis"></div>

      <div class="section-title">Alerts</div>
      <div class="card" style="margin-bottom:14px;"><div id="alerts"></div></div>

      <div class="section-title">Region comparison</div>
      <div class="region-grid" id="regionCards"></div>
      <div class="card" style="margin-bottom:14px;">
        <h2>Domain mastery — Region 1 vs Region 2</h2>
        <canvas id="regionDomainChart" height="220"></canvas>
      </div>
      <div class="card" style="margin-bottom:14px;">
        <h2>Proficiency band distribution by region</h2>
        <canvas id="regionBandChart" height="160"></canvas>
      </div>

      <div class="section-title">Program-wide analytics</div>
      <div class="row2">
        <div class="card"><h2>Domain performance (all testers)</h2><canvas id="domainChart" height="240"></canvas></div>
        <div class="card"><h2>Program proficiency bands</h2><canvas id="bandChart" height="240"></canvas></div>
      </div>
      <div class="row2">
        <div class="card"><h2>Score distribution</h2><canvas id="scoreDistChart" height="240"></canvas></div>
        <div class="card"><h2>Submissions over time</h2><canvas id="timelineChart" height="240"></canvas></div>
      </div>

      <div class="section-title">Tester rankings</div>
      <div class="card" style="margin-bottom:14px;">
        <table>
          <thead><tr><th>#</th><th>Token</th><th>Region</th><th>Score</th><th>%</th><th>Band</th><th>Submitted</th><th></th></tr></thead>
          <tbody id="rankings"></tbody>
        </table>
        <p class="muted" style="margin-top:10px;">
          Click a tester name to view their full test. <strong>Reset</strong> archives a prior attempt and allows the tester to retake after additional training.
        </p>
      </div>

      <div class="section-title">Question difficulty (sorted hardest first)</div>
      <div class="card" style="margin-bottom:14px;">
        <table>
          <thead><tr><th>Q#</th><th>Domain</th><th>Attempts</th><th>% mastery</th></tr></thead>
          <tbody id="qDifficulty"></tbody>
        </table>
      </div>

      <div class="section-title">Tester × Question heat map</div>
      <div class="card" style="margin-bottom:14px;">
        <div class="heatmap-wrap"><table class="heatmap-table" id="heatmapTable"></table></div>
        <p class="muted" style="margin-top:8px;">Green = full points · Yellow = partial · Red = zero · Gray = not answered</p>
      </div>

      <div class="section-title">Write-in responses flagged for review</div>
      <div class="card" style="margin-bottom:14px;"><div id="flagged"></div></div>

      <div class="section-title">Overridden responses (history + re-review)</div>
      <div class="card" style="margin-bottom:14px;"><div id="overrideHistory"></div></div>

      <p class="muted" style="margin-top:6px;margin-bottom:32px;">
        Last loaded: <span id="loadedAt">—</span> &nbsp;·&nbsp;
        Thresholds: ≥80% proficient &nbsp;·&nbsp; 70–80% reinforcement &nbsp;·&nbsp; &lt;70% retraining
      </p>
    </main>`;
}

// ─── Load ────────────────────────────────────────────────────────────────────
async function load() {
  if (!secret) return loginScreen();
  shell();
  let m;
  try {
    const r = await fetch('/.netlify/functions/analytics', { headers: {'x-admin-secret': secret} });
    if (r.status === 401) { sessionStorage.removeItem(SECRET_KEY); secret=''; return loginScreen('Invalid secret.'); }
    m = await r.json();
  } catch {
    document.getElementById('kpis').innerHTML = '<p class="empty">Failed to load analytics — check that functions are deployed (not Netlify Drop).</p>';
    return;
  }
  // Also fetch raw submissions for detail views + heatmap + override history
  try {
    const sr = await fetch('/.netlify/functions/submissions', { headers: {'x-admin-secret': secret} });
    if (sr.ok) { const sd = await sr.json(); submissionsCache = sd.submissions || []; }
    else submissionsCache = [];
  } catch { submissionsCache = []; }

  // Fetch question bank for MC/MS answer display in detail modal
  try {
    const qr = await fetch('/questions.json');
    if (qr.ok) questionsCache = await qr.json();
    else questionsCache = null;
  } catch { questionsCache = null; }

  document.getElementById('csvBtn').addEventListener('click', e => { e.preventDefault(); downloadCsv(); });
  document.getElementById('loadedAt').textContent = new Date().toLocaleString();

  destroyCharts();
  renderKpis(m);
  renderAlerts(m);
  renderRegionCards(m);
  renderRegionDomainChart(m);
  renderRegionBandChart(m);
  renderDomainChart(m);
  renderBandChart(m);
  renderScoreDistribution(m);
  renderTimeline(m);
  renderRankings(m);
  renderQuestionDifficulty(m);
  renderHeatMap();
  renderFlagged(m);
  renderOverrideHistory();
}

function destroyCharts() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

// ─── KPIs ────────────────────────────────────────────────────────────────────
function renderKpis(m) {
  const k = m.program || {};
  document.getElementById('kpis').innerHTML = `
    <div class="card kpi"><div class="label">Total submissions</div><div class="val">${k.totalSubmissions||0}</div></div>
    <div class="card kpi"><div class="label">Unique testers</div><div class="val">${k.uniqueTesters||0}</div></div>
    <div class="card kpi"><div class="label">Program avg %</div><div class="val ${pctClass(k.avgPct||0)}">${k.avgPct||0}%</div></div>
    <div class="card kpi"><div class="label">Proficient ≥80%</div><div class="val pct-good">${k.proficientRate||0}%</div></div>
    <div class="card kpi"><div class="label">Needs reinforcement</div><div class="val pct-warn">${k.reinforcementRate||0}%</div></div>
    <div class="card kpi"><div class="label">Needs retraining</div><div class="val pct-bad">${k.retrainingRate||0}%</div></div>`;
}

// ─── Alerts ──────────────────────────────────────────────────────────────────
function renderAlerts(m) {
  const a = m.alerts || [];
  document.getElementById('alerts').innerHTML = a.length
    ? a.map(x => `<div class="alert-box ${x.level}"><strong>${x.level.toUpperCase()}:</strong> ${escHtml(x.message)}</div>`).join('')
    : '<div class="empty">No alerts — all thresholds within range.</div>';
}

// ─── Region comparison cards ─────────────────────────────────────────────────
function renderRegionCards(m) {
  const regions = m.regions || {};
  const order   = ['Region 1','Region 2'];
  const keys    = [...order.filter(r => regions[r]), ...Object.keys(regions).filter(r => !order.includes(r))];

  if (!keys.length) {
    document.getElementById('regionCards').innerHTML = '<p class="empty" style="grid-column:1/-1">No region data yet — make sure tester links include <code>?region=Region 1</code> or <code>?region=Region 2</code>.</p>';
    return;
  }

  document.getElementById('regionCards').innerHTML = keys.map((reg, idx) => {
    const rb  = regions[reg];
    const cls = idx === 0 ? 'r1' : 'r2';
    const domRows = Object.entries(rb.domains || {}).map(([dom, d]) => `
      <div class="domain-bar-row">
        <span style="flex:1;">${escHtml(dom)}</span>
        <span class="bar-wrap"><span class="bar-fill" style="width:${d.pct}%;background:${barColor(d.pct)};"></span></span>
        <span class="${pctClass(d.pct)}" style="min-width:36px;text-align:right;">${d.pct}%</span>
      </div>`).join('');

    return `
      <div class="region-card ${cls}">
        <h3 class="${cls}">${escHtml(reg)}</h3>
        <div class="mini-kpi-row">
          <div class="mini-kpi"><div class="ml">Testers</div><div class="mv">${rb.totalSubmissions}</div></div>
          <div class="mini-kpi"><div class="ml">Avg %</div><div class="mv ${pctClass(rb.avgPct)}">${rb.avgPct}%</div></div>
          <div class="mini-kpi"><div class="ml">Proficient</div><div class="mv pct-good">${rb.proficientRate}%</div></div>
          <div class="mini-kpi"><div class="ml">Retraining</div><div class="mv pct-bad">${rb.retrainingRate}%</div></div>
        </div>
        <div style="margin-top:8px;">${domRows || '<span class="empty">No domain data.</span>'}</div>
      </div>`;
  }).join('');
}

// ─── Region domain grouped bar chart ─────────────────────────────────────────
function renderRegionDomainChart(m) {
  const regions   = m.regions || {};
  const r1        = regions['Region 1'] || {};
  const r2        = regions['Region 2'] || {};
  const allDomains = [...new Set([...Object.keys(r1.domains||{}), ...Object.keys(r2.domains||{})])];

  charts.regionDomain = new Chart(document.getElementById('regionDomainChart'), {
    type: 'bar',
    data: {
      labels: allDomains,
      datasets: [
        { label:'Region 1', data: allDomains.map(d => (r1.domains||{})[d]?.pct ?? 0), backgroundColor:'rgba(99,102,241,.8)' },
        { label:'Region 2', data: allDomains.map(d => (r2.domains||{})[d]?.pct ?? 0), backgroundColor:'rgba(245,158,11,.8)' }
      ]
    },
    options: {
      indexAxis:'y', scales:{ x:{ beginAtZero:true, max:100, ticks:{callback:v=>v+'%'} } },
      plugins:{ legend:{ position:'top' }, tooltip:{ callbacks:{ label: ctx => `${ctx.dataset.label}: ${ctx.parsed.x}%` } } }
    }
  });
}

// ─── Region band stacked bar ──────────────────────────────────────────────────
function renderRegionBandChart(m) {
  const regions = m.regions || {};
  const labels  = Object.keys(regions);
  const get = (reg, band) => (regions[reg]?.bandCounts?.[band] || 0);

  charts.regionBand = new Chart(document.getElementById('regionBandChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label:'Proficient (≥80%)',        data:labels.map(r=>get(r,'proficient')),          backgroundColor:'#16a34a' },
        { label:'Needs reinforcement (70–84%)', data:labels.map(r=>get(r,'needs_reinforcement')), backgroundColor:'#eab308' },
        { label:'Needs retraining (<70%)',   data:labels.map(r=>get(r,'needs_retraining')),    backgroundColor:'#dc2626' }
      ]
    },
    options: {
      plugins:{ legend:{ position:'bottom' } },
      scales:{ x:{ stacked:true }, y:{ stacked:true, ticks:{ stepSize:1 } } }
    }
  });
}

// ─── Program domain bar ───────────────────────────────────────────────────────
function renderDomainChart(m) {
  const domains = m.domains || {};
  const labels  = Object.keys(domains);
  const data    = labels.map(d => domains[d].pct);
  charts.domain = new Chart(document.getElementById('domainChart'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'% mastery', data, backgroundColor:data.map(barColor) }] },
    options:{ indexAxis:'y', scales:{ x:{ beginAtZero:true, max:100, ticks:{callback:v=>v+'%'} } }, plugins:{ legend:{ display:false } } }
  });

// ─── Band doughnut ────────────────────────────────────────────────────────────
function renderBandChart(m) {
  const b = m.bandCounts || {};
  charts.band = new Chart(document.getElementById('bandChart'), {
    type:'doughnut',
    data:{
      labels:['Proficient (≥80%)','Needs reinforcement (70–80%)','Needs retraining (<70%)'],
      datasets:[{ data:[b.proficient||0,b.needs_reinforcement||0,b.needs_retraining||0],
        backgroundColor:['#16a34a','#eab308','#dc2626'] }]
    },
    options:{ plugins:{ legend:{ position:'bottom' } } }
  });
}

// ─── NEW: Score distribution histogram ──────────────────────────────────────────
function renderScoreDistribution(m) {
  const rk = m.rankings || [];
  const bins = [
    {label:'0–49%',min:0,max:49,count:0},
    {label:'50–59%',min:50,max:59,count:0},
    {label:'60–69%',min:60,max:69,count:0},
    {label:'70–79%',min:70,max:79,count:0},
    {label:'80–89%',min:80,max:89,count:0},
    {label:'90–100%',min:90,max:100,count:0}
  ];
  rk.forEach(r => {
    const p = r.pct || 0;
    const bin = bins.find(b => p >= b.min && p <= b.max);
    if (bin) bin.count++;
  });
  charts.scoreDist = new Chart(document.getElementById('scoreDistChart'), {
    type:'bar',
    data:{
      labels: bins.map(b=>b.label),
      datasets:[{
        label:'Testers',
        data: bins.map(b=>b.count),
        backgroundColor: ['#dc2626','#dc2626','#dc2626','#eab308','#16a34a','#16a34a']
      }]
    },
    options:{
      scales:{ y:{ beginAtZero:true, ticks:{stepSize:1} }, x:{ ticks:{font:{size:11}} } },
      plugins:{ legend:{display:false} }
    }
  });
}

// ─── Rankings (with clickable token) ────────────────────────────────────────
function renderRankings(m) {
  const rk = m.rankings || [];
  document.getElementById('rankings').innerHTML = rk.length
    ? rk.map((r,i) => `<tr>
        <td class="${i===0?'rank-1':''}\">${i+1}</td>
        <td><span class="clickable-token" onclick="showTesterDetail('${escHtml(r.token)}')">${escHtml(r.token)}</span></td>
        <td>${regionTag(r.region)}</td>
        <td>${r.earned}/${r.max}</td>
        <td class="${pctClass(r.pct)}">${r.pct}%</td>
        <td><span class="band-pill band-${r.band}">${(r.band||'').replace(/_/g,' ')}</span></td>
        <td class="muted">${(r.timestamp||'').replace('T',' ').slice(0,16)}</td>
        <td><button onclick="resetToken('${escHtml(r.token)}')"
          style="background:#fff;color:var(--bad);border:1px solid var(--bad);padding:3px 9px;border-radius:5px;cursor:pointer;font-size:11px;">
          Reset</button></td>
      </tr>`).join('')
    : '<tr><td colspan="8" class="empty">No submissions yet.</td></tr>';

// ─── Question difficulty ──────────────────────────────────────────────────────
function renderQuestionDifficulty(m) {
  const qs = Object.values(m.questionDifficulty || {}).sort((a,b) => a.pct - b.pct);
  const CURRENT_MAX = 25;
  document.getElementById('qDifficulty').innerHTML = qs.length
    ? qs.map(q => {
        const isLegacy = Number(q.id) > CURRENT_MAX;
        const domainLabel = q.displayDomain || q.domain;
        return `<tr${isLegacy ? ' style="opacity:.55;"' : ''}>
        <td>Q${q.id}${isLegacy ? ' <span class="muted" style="font-size:10px;">(legacy)</span>' : ''}</td>
        <td>${escHtml(domainLabel)}</td>
        <td>${q.attempts}</td>
        <td class="${pctClass(q.pct)}">${q.pct}%</td>
      </tr>`}).join('')
    : '<tr><td colspan="4" class="empty">No data yet.</td></tr>';
}

// ─── NEW: Heat map (tester × question) ───────────────────────────────────────
function renderHeatMap() {
  const subs = submissionsCache || [];
  if (!subs.length) {
    document.getElementById('heatmapTable').innerHTML = '<tr><td class="empty">No submissions data for heat map.</td></tr>';
    return;
  }
  // Find all question IDs across submissions
  const qIds = new Set();
  subs.forEach(s => (s.items||[]).forEach(i => qIds.add(i.id)));
  const sortedQIds = [...qIds].sort((a,b) => a - b);

  let html = '<thead><tr><th>Tester</th>';
  sortedQIds.forEach(q => html += `<th>Q${q}</th>`);
  html += '<th>Total</th></tr></thead><tbody>';

  subs.forEach(s => {
    html += `<tr><td><span class="clickable-token" onclick="showTesterDetail('${escHtml(s.token)}')">${escHtml(s.token)}</span></td>`;
    const itemMap = {};
    (s.items||[]).forEach(i => itemMap[i.id] = i);
    sortedQIds.forEach(qid => {
      const item = itemMap[qid];
      if (!item) { html += '<td class="heatmap-cell hm-na">—</td>'; return; }
      const ratio = item.max > 0 ? item.earned / item.max : 0;
      let cls, txt;
      if (item.type === 'write') {
        txt = `${item.earned}/${item.max}`;
        cls = ratio >= 1 ? 'hm-full' : ratio > 0 ? 'hm-partial' : 'hm-zero';
      } else {
        txt = ratio >= 1 ? '✓' : '✗';
        cls = ratio >= 1 ? 'hm-full' : 'hm-zero';
      }
      html += `<td class="heatmap-cell ${cls}" title="${escHtml(s.token)} Q${qid}: ${item.earned}/${item.max}">${txt}</td>`;
    });
    html += `<td class="${pctClass(s.pct)}" style="font-weight:700;">${s.earned}/${s.max} (${s.pct}%)</td></tr>`;
  });
  html += '</tbody>';
  document.getElementById('heatmapTable').innerHTML = html;
}

// ─── Flagged write-ins (grouped by tester) ─────────────────────────────────────
function renderFlagged(m) {
  const f = m.flaggedReviews || [];
  if (!f.length) {
    document.getElementById('flagged').innerHTML = '<div class="empty">No write-in responses awaiting review.</div>';
    return;
  }
  const groups = {};
  f.forEach(r => {
    const key = r.token || 'Unknown';
    if (!groups[key]) groups[key] = { token: key, region: r.region, items: [] };
    groups[key].items.push(r);
  });
  const sorted = Object.values(groups).sort((a, b) => b.items.length - a.items.length);

  document.getElementById('flagged').innerHTML = sorted.map(g => {
    const cardId = 'rc-' + escHtml(g.token).replace(/\s+/g, '-');
    const flagged = g.items.length;
    return `
      <div class="review-card" id="${cardId}">
        <div class="review-card-header" onclick="toggleReviewCard('${cardId}')">
          <div>
            <span class="token">${escHtml(g.token)}</span>
            <span style="margin-left:6px;">${regionTag(g.region)}</span>
          </div>
          <div class="meta">
            <span class="review-badge pending">${flagged} ${flagged === 1 ? 'review' : 'reviews'}</span>
            <span style="font-size:12px;color:var(--muted);">▼</span>
          </div>
        </div>
        <div class="review-card-body">
          ${g.items.map(r => `
            <div class="review-item">
              <div class="q-label">Q${r.questionId} · ${escHtml(r.displayDomain || r.domain)}</div>
              <div class="rubric-info">Rubric keywords matched: ${r.rubricMatched || 0}/${r.rubricTotal || 0} · <span class="muted">${(r.timestamp || '').replace('T', ' ').slice(0, 16)}</span></div>
              <div class="response-text">${escHtml(r.response || '(no response)')}</div>
              <div class="override-row">
                <label>Earned:</label>
                <input id="oe-${escHtml(r.token)}-${r.questionId}" type="number" min="0" placeholder="${r.rubricMatched || 0}" />
                <label>Max:</label>
                <input id="om-${escHtml(r.token)}-${r.questionId}" type="number" min="0" placeholder="${r.rubricTotal || 0}" />
                <button onclick="overrideScore('${escHtml(r.token)}',${r.questionId},'${cardId}')">Save override</button>
                <span id="ov-result-${r.questionId}-${escHtml(r.token).replace(/'/g,"\\'")}" class="result"></span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleReviewCard(cardId) {
  const el = document.getElementById(cardId);
  if (el) el.classList.toggle('open');
}

// ─── NEW: Override history + re-review ────────────────────────────────────────
function renderOverrideHistory() {
  const subs = submissionsCache || [];
  const entries = [];
  subs.forEach(s => {
    (s.items||[]).forEach(item => {
      if (item.overrides && item.overrides.length > 0) {
        entries.push({ token: s.token, region: s.region, item });
      }
    });
  });
  if (!entries.length) {
    document.getElementById('overrideHistory').innerHTML = '<div class="empty">No overrides have been applied yet.</div>';
    return;
  }
  // Group by token
  const groups = {};
  entries.forEach(e => {
    if (!groups[e.token]) groups[e.token] = { token: e.token, region: e.region, items: [] };
    groups[e.token].items.push(e.item);
  });

  document.getElementById('overrideHistory').innerHTML = Object.values(groups).map(g => {
    const cardId = 'oh-' + escHtml(g.token).replace(/\s+/g, '-');
    return `
      <div class="review-card" id="${cardId}">
        <div class="review-card-header" onclick="toggleReviewCard('${cardId}')">
          <div>
            <span class="token">${escHtml(g.token)}</span>
            <span style="margin-left:6px;">${regionTag(g.region)}</span>
          </div>
          <div class="meta">
            <span class="review-badge done">${g.items.length} override${g.items.length===1?'':'s'}</span>
            <span style="font-size:12px;color:var(--muted);">▼</span>
          </div>
        </div>
        <div class="review-card-body">
          ${g.items.map(item => `
            <div class="review-item">
              <div class="q-label">Q${item.id} · ${escHtml(item.domain || '')}</div>
              <div class="rubric-info">Current: ${item.earned}/${item.max} · <span class="muted">Type: ${item.type}</span></div>
              <div class="response-text">${escHtml(String(item.response||'').substring(0,200))}</div>
              <div class="override-history">
                <div class="oh-title">Override history:</div>
                ${item.overrides.map(ov => `<div class="oh-entry">${ov.from} → ${ov.to} by ${ov.by} at ${(ov.at||'').replace('T',' ').slice(0,16)}</div>`).join('')}
              </div>
              <div class="override-row" style="margin-top:8px;">
                <label>New earned:</label>
                <input id="rre-${escHtml(g.token)}-${item.id}" type="number" min="0" placeholder="${item.earned}" />
                <label>Max:</label>
                <input id="rrm-${escHtml(g.token)}-${item.id}" type="number" min="0" placeholder="${item.max}" />
                <button onclick="overrideScore('${escHtml(g.token)}',${item.id},'${cardId}')">Re-override</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

// ─── NEW: Tester detail modal ─────────────────────────────────────────────────
async function showTesterDetail(token) {
  // Find in cache first
  let sub = (submissionsCache||[]).find(s => s.token === token);
  if (!sub) {
    // Try fetching
    try {
      const r = await fetch('/.netlify/functions/submissions', { headers: {'x-admin-secret': secret} });
      if (r.ok) { const d = await r.json(); submissionsCache = d.submissions || []; sub = submissionsCache.find(s => s.token === token); }
    } catch {}
  }
  if (!sub) { alert('Tester not found.'); return; }

  const bandCls = `band-${sub.band}`;
  const items = sub.items || [];
  // Sort by question ID
  items.sort((a,b) => a.id - b.id);

  let html = `<div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
    <div class="modal-content">
      <div class="modal-header">
        <h2>${escHtml(sub.token)} — Full Test Detail</h2>
        <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-meta">
          <span>${regionTag(sub.region)}</span>
          <span>Score: <strong>${sub.earned}/${sub.max}</strong> (<strong class="${pctClass(sub.pct)}">${sub.pct}%</strong>)</span>
          <span><span class="band-pill ${bandCls}">${(sub.band||'').replace(/_/g,' ')}</span></span>
          <span class="muted">Submitted: ${(sub.timestamp||'').replace('T',' ').slice(0,16)}</span>
        </div>`;

  items.forEach(item => {
    const ratio = item.max > 0 ? item.earned / item.max : 0;
    const statusIcon = ratio >= 1 ? '✅' : ratio > 0 ? '🔶' : '❌';
    const typeLabel = item.type === 'mc' ? 'Multiple Choice' : item.type === 'ms' ? 'Multi-Select' : 'Write-in';

    html += `<div class="detail-item">
      <div class="detail-item-header">
        <span class="qid">Q${item.id}</span>
        <span class="qdomain">${escHtml(item.domain || '')}</span>
        <span class="qscore ${pctClass(ratio >= 1 ? 100 : ratio > 0 ? 75 : 0)}">${item.earned}/${item.max}</span>
        <span class="qstatus">${statusIcon}</span>
      </div>
      <div class="detail-item-body">`;

    if (item.type === 'mc') {
      const qDef = questionsCache ? questionsCache.find(q => q.id === item.id) : null;
      const optMap = {};
      if (qDef && qDef.options) qDef.options.forEach(o => optMap[o.key] = o.text);
      const ansText = optMap[item.answer] || item.answer;
      const correctAns = qDef ? qDef.correct : null;
      const correctText = correctAns ? (optMap[correctAns] || correctAns) : null;
      html += `<div class="label">Answer</div><div class="value"><code>${escHtml(String(item.answer||'—').toUpperCase())}</code> ${escHtml(ansText !== item.answer ? '— ' + ansText : '')} ${item.correct ? '✅ Correct' : '❌ Incorrect'}</div>`;
      if (!item.correct && correctText) {
        html += `<div class="label">Correct answer</div><div class="value"><code>${escHtml(String(correctAns).toUpperCase())}</code> ${escHtml(correctText)} ✅</div>`;
      }
    } else if (item.type === 'ms') {
      const ans = Array.isArray(item.answer) ? item.answer : [item.answer];
      const qDef = questionsCache ? questionsCache.find(q => q.id === item.id) : null;
      const optMap = {};
      if (qDef && qDef.options) qDef.options.forEach(o => optMap[o.key] = o.text);
      const correctSet = qDef ? new Set(qDef.correct) : null;
      html += `<div class="label">Answers selected</div><div class="value">`;
      ans.forEach(a => {
        const text = optMap[a] || a;
        const isRight = correctSet ? correctSet.has(a) : null;
        const mark = isRight === true ? ' ✅' : isRight === false ? ' ❌' : '';
        html += `<div style="margin:2px 0;"><code>${escHtml(a.toUpperCase())}</code> ${escHtml(text)}${mark}</div>`;
      });
      if (!item.correct && correctSet) {
        html += `<div class="label" style="margin-top:6px;">Correct answers</div><div class="value">`;
        [...correctSet].forEach(c => {
          const text = optMap[c] || c;
          html += `<div style="margin:2px 0;"><code>${escHtml(c.toUpperCase())}</code> ${escHtml(text)} ✅</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    } else if (item.type === 'write') {
      html += `<div class="label">Response</div><div class="value" style="background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:8px 10px;white-space:pre-wrap;line-height:1.5;">${escHtml(String(item.response||'(no response)'))}</div>`;
      if (item.rubricMatched != null) {
        html += `<div class="label">Rubric match</div><div class="value">${item.rubricMatched}/${item.rubricTotal} keyword groups</div>`;
      }
    }
    if (item.overrides && item.overrides.length) {
      html += `<div class="override-history"><div class="oh-title">Override history:</div>`;
      item.overrides.forEach(ov => {
        html += `<div class="oh-entry">${ov.from} → ${ov.to} by ${ov.by} at ${(ov.at||'').replace('T',' ').slice(0,16)}${ov.maxOverride ? ' (max: '+ov.maxOverride+')' : ''}</div>`;
      });
      html += `</div>`;
    }
    html += `</div></div>`;
  });

  // Domain breakdown
  if (sub.domains) {
    html += `<h2 style="margin-top:16px;">Domain breakdown</h2>`;
    Object.entries(sub.domains).forEach(([name, d]) => {
      if (typeof d === 'object') {
        html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border);font-size:13px;">
          <span>${escHtml(name)}</span>
          <span class="${pctClass(d.pct)}">${d.earned}/${d.max} = ${d.pct}%</span>
        </div>`;
      }
    });
  }

  html += `</div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

// ─── Actions ──────────────────────────────────────────────────────────────────
async function resetToken(token) {
  if (!confirm(`Reset "${token}"?\n\nTheir prior attempt will be archived and they can retake the assessment.`)) return;
  const r = await fetch('/.netlify/functions/reset-token', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-admin-secret':secret},
    body: JSON.stringify({ token })
  });
  if (!r.ok) return alert('Reset failed: HTTP ' + r.status);
  const d = await r.json();
  alert(`Done — archived ${d.archivedCount} attempt(s) for "${token}". They can now retake.`);
  load();
}

async function downloadCsv() {
  const r = await fetch('/.netlify/functions/submissions?format=csv', { headers:{'x-admin-secret':secret} });
  if (!r.ok) return alert('Export failed: HTTP ' + r.status);
  const blob = await r.blob();
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href:url, download:'dis-submissions.csv' });
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ─── Score Override (works for both flagged and re-override) ───────────────────
async function overrideScore(token, questionId, cardId) {
  // Try both ID prefixes: oe- (flagged) and rre- (re-review)
  let earnedEl = document.getElementById('oe-' + token + '-' + questionId)
              || document.getElementById('rre-' + token + '-' + questionId);
  let maxEl    = document.getElementById('om-' + token + '-' + questionId)
              || document.getElementById('rrm-' + token + '-' + questionId);
  const resultEl = document.getElementById('ov-result-' + questionId + '-' + token.replace(/'/g, "\\'"));

  if (!earnedEl) { alert('Override fields not found — try refreshing.'); return; }
  const earned = Number(earnedEl.value);
  const max = maxEl && maxEl.value !== '' ? Number(maxEl.value) : undefined;
  if (isNaN(earned) || earned < 0) { alert('Enter a valid earned score (0 or higher).'); return; }
  if (!confirm(`Override Q${questionId} for "${token}": earned = ${earned}${max != null ? ', max = ' + max : ''}?\n\nThe submission's total score, pct, band, and domain breakdown will be recalculated.`)) return;
  try {
    const r = await fetch('/.netlify/functions/override-score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
      body: JSON.stringify({ token, questionId, earned, max })
    });
    const d = await r.json();
    if (!r.ok) { alert('Override failed: ' + (d.error || 'HTTP ' + r.status)); return; }
    if (resultEl) resultEl.textContent = '✓ Saved — ' + d.earned + '/' + d.max + ' (' + d.pct + '%, ' + d.band.replace(/_/g,' ') + ')';
    // Fade the item if in flagged section
    const item = earnedEl.closest('.review-item');
    if (item) {
      item.style.opacity = '0.5';
      const btn = item.querySelector('button');
      if (btn) { btn.disabled = true; btn.textContent = 'Saved'; }
    }
    // Update badge count on the card
    if (cardId) {
      const card = document.getElementById(cardId);
      if (card) {
        const badge = card.querySelector('.review-badge');
        if (badge) {
          let count = parseInt(badge.textContent);
          if (!isNaN(count)) {
            count--;
            if (count <= 0) { badge.textContent = '✓ Done'; badge.className = 'review-badge done'; }
            else badge.textContent = count + (count === 1 ? ' review' : ' reviews');
          }
        }
      }
    }
  } catch (e) { alert('Override failed: ' + e.message); }
}

if (!secret) loginScreen(); else load();
