<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIS Dashboard — Standalone</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--primary:#0b5ed7;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--good:#16a34a;--warn:#eab308;--bad:#dc2626;--r1:#6366f1;--r2:#f59e0b;}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
header{background:var(--primary);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:19px}
main{max-width:1240px;margin:22px auto;padding:0 16px}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.kpi{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi .card .l{font-size:11px;color:var(--muted);text-transform:uppercase}
.kpi .card .v{font-size:26px;font-weight:700;margin-top:4px}
.g{color:var(--good);font-weight:600} .w{color:var(--warn);font-weight:600} .b{color:var(--bad);font-weight:600}
.pg{color:var(--good)} .pw{color:var(--warn)} .pb{color:var(--bad)}
.row2{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:14px}
@media(max-width:820px){.row2{grid-template-columns:1fr}}
.region-row{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:14px}
@media(max-width:820px){.region-row{grid-template-columns:1fr}}
.rc{border-radius:10px;padding:18px}
.rc.r1{background:#eef2ff;border:2px solid var(--r1)}
.rc.r2{background:#fffbeb;border:2px solid var(--r2)}
.rc h3{margin:0 0 12px;font-size:15px}
.rc.r1 h3{color:var(--r1)}.rc.r2 h3{color:#b45309}
.mkpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mkpi>div{flex:1;min-width:90px;background:rgba(255,255,255,.7);border-radius:8px;padding:10px;text-align:center}
.mkpi .ml{font-size:10px;color:var(--muted);text-transform:uppercase}
.mkpi .mv{font-size:20px;font-weight:700;margin-top:2px}
.dr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.dr:last-child{border:0}
.bw{width:120px;height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;display:inline-block;margin:0 8px;vertical-align:middle}
.bf{height:100%;border-radius:4px}
h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
.band-pill{padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase}
.band-proficient{background:#dcfce7;color:#166534}
.band-needs_reinforcement{background:#fef3c7;color:#92400e}
.band-needs_retraining{background:#fee2e2;color:#991b1b}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
.alert-box{padding:9px 12px;border-radius:6px;margin-bottom:8px;font-size:13px}
.alert-box.critical{background:#fee2e2;color:#991b1b;border-left:4px solid var(--bad)}
.alert-box.warning{background:#fef3c7;color:#92400e;border-left:4px solid var(--warn)}
.tag-r1{background:#eef2ff;color:var(--r1);padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600}
.tag-r2{background:#fffbeb;color:#b45309;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
</style>
</head>

html+=`<div class="row2"><div class="card"><h2>Domain Mastery — All Testers</h2><canvas id="domainChart" height="300"></canvas></div>
<div class="card"><h2>Proficiency Bands</h2><canvas id="bandChart" height="300"></canvas></div></div>
<div class="row2"><div class="card"><h2>Domain Mastery — Region 1 vs 2</h2><canvas id="regionChart" height="300"></canvas></div></div>`;

// Rankings
html+=`<div class="sec">Rankings</div><div class="card" style="margin-bottom:14px"><table><thead><tr><th>#</th><th>Token</th><th>Region</th><th>Score</th><th>%</th><th>Band</th></tr></thead><tbody>`;
D.rankings.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td>${esc(r.token)}</td><td>${rTag(r.region)}</td><td>${r.earned}/${r.max}</td><td class="${pctCls(r.pct)}">${r.pct}%</td><td><span class="band-pill band-${r.band}">${r.band.replace(/_/g,' ')}</span></td></tr>`});
html+=`</tbody></table></div>`;

// Question difficulty
html+=`<div class="sec">Question Difficulty</div><div class="card"><table><thead><tr><th>Q#</th><th>Domain</th><th>Attempts</th><th>% Mastery</th></tr></thead><tbody>`;
D.qdiff.forEach(q=>{html+=`<tr><td>Q${q.id}</td><td>${esc(q.domain)}</td><td>${q.attempts}</td><td class="${pctCls(q.pct)}">${q.pct}%</td></tr>`});
html+=`</tbody></table></div>`;

html+=`<p class="muted" style="margin:20px 0 32px;text-align:center">Standalone View · Data: ${D.total} submissions · Thresholds: ≥85% Proficient · 70–84% Reinforcement · <70% Retraining</p></main>`;
document.getElementById('app').innerHTML = html;

// Render charts after DOM
setTimeout(()=>{
  // Domain bar
  const dl=Object.keys(D.domains), dd=dl.map(d=>D.domains[d]);
  C.domain = new Chart(document.getElementById('domainChart'),{type:'bar',data:{labels:dl,datasets:[{label:'% Mastery',data:dd,backgroundColor:dd.map(barCol)}]},options:{indexAxis:'y',scales:{x:{max:100,ticks:{callback:v=>v+'%'}}},plugins:{legend:{display:false}}}});

  // Band doughnut
  C.band = new Chart(document.getElementById('bandChart'),{type:'doughnut',data:{labels:['Proficient','Reinforcement','Retraining'],datasets:[{data:[D.bands.proficient,D.bands.needs_reinforcement,D.bands.needs_retraining],backgroundColor:['#16a34a','#eab308','#dc2626']}]},options:{plugins:{legend:{position:'bottom'}}}});

  // Region domain comparison
  const regs=D.regions, allDoms=[...new Set([...Object.keys((regs['Region 1']||{}).domains||{}),...Object.keys((regs['Region 2']||{}).domains||{})])];
  C.region = new Chart(document.getElementById('regionChart'),{type:'bar',data:{labels:allDoms,datasets:[{label:'Region 1',data:allDoms.map(d=>((regs['Region 1']||{}).domains||{})[d]??0),backgroundColor:'rgba(99,102,241,.8)'},{label:'Region 2',data:allDoms.map(d=>((regs['Region 2']||{}).domains||{})[d]??0),backgroundColor:'rgba(245,158,11,.8)'}]},options:{indexAxis:'y',scales:{x:{max:100,ticks:{callback:v=>v+'%'}}},plugins:{legend:{position:'top'}}}});
},10);
</script>
</body>
</html>
